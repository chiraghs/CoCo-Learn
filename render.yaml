services:
  - type: web
    name: supplychainiq
    runtime: static
    buildCommand: echo "Building SupplyChainIQ Static Showcase..."
    staticPublishPath: ./
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
